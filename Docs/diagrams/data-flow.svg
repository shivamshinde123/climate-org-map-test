<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 242"
     role="img" aria-labelledby="dflow-title dflow-desc"
     style="background:#f5f5f5;font-family:'Segoe UI',system-ui,-apple-system,sans-serif">
  <title id="dflow-title">GCC Climate Org Map — Data Pipeline</title>
  <desc id="dflow-desc">Six-stage pipeline: IRS CSVs feed Build and Geocode, producing a central GeoJSON store. GeoJSON optionally feeds AI Enrichment (Brave Search, contact crawler, Jev classifier). Both paths converge through GitHub Actions CI/CD to a MapLibre browser map on GitHub Pages.</desc>

  <defs>
    <pattern id="dflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.08)"/>
    </pattern>
    <marker id="dflow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/>
    </marker>
    <marker id="dflow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="242" fill="#f5f5f5"/>
  <rect width="860" height="208" fill="url(#dflow-dots)"/>

  <!-- Legend divider -->
  <line x1="0" y1="208" x2="860" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <!-- ── ARROWS (drawn before nodes) ── -->

  <!-- N1 → N2 -->
  <line x1="136" y1="74" x2="184" y2="74"
        stroke="#4f5d75" stroke-width="1" marker-end="url(#dflow-arr-muted)"/>

  <!-- N2 → N3 -->
  <line x1="324" y1="74" x2="372" y2="74"
        stroke="#4f5d75" stroke-width="1" marker-end="url(#dflow-arr-muted)"/>

  <!-- N3 → N5 -->
  <line x1="492" y1="74" x2="540" y2="74"
        stroke="#4f5d75" stroke-width="1" marker-end="url(#dflow-arr-muted)"/>

  <!-- N5 → N6  published -->
  <line x1="676" y1="74" x2="724" y2="74"
        stroke="#2e5aa8" stroke-width="1" marker-end="url(#dflow-arr-link)"/>

  <!-- N3 → N4  optional dashed -->
  <line x1="432" y1="100" x2="432" y2="148"
        stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"
        marker-end="url(#dflow-arr-muted)"/>

  <!-- OPTIONAL label (≥6 px gap from stroke at x=432) -->
  <rect x="440" y="117" width="54" height="12" rx="2" fill="#f5f5f5"/>
  <text x="467" y="126.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" font-weight="700" fill="#4f5d75" letter-spacing="0.6">OPTIONAL</text>

  <!-- ── NODES ── -->

  <!-- N1: IRS CSVs — input -->
  <rect x="16" y="48" width="120" height="52" rx="6"
        fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="20" y="52" width="28" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
  <text x="34" y="59.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#4f5d75">INPUT</text>
  <text x="76" y="74" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">IRS CSVs</text>
  <text x="76" y="87" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">20K+ orgs</text>
  <text x="76" y="96" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">NTEE codes</text>

  <!-- N2: Build + Geocode — process -->
  <rect x="184" y="48" width="140" height="52" rx="6"
        fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="188" y="52" width="32" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
  <text x="204" y="59.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#4f5d75">PROCESS</text>
  <text x="254" y="74" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">Build + Geocode</text>
  <text x="254" y="87" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">filter · normalize</text>
  <text x="254" y="96" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">Census coords</text>

  <!-- N3: GeoJSON — store -->
  <rect x="372" y="48" width="120" height="52" rx="6"
        fill="rgba(46,90,168,0.06)" stroke="rgba(46,90,168,0.35)" stroke-width="1"/>
  <rect x="376" y="52" width="26" height="10" rx="2" fill="rgba(46,90,168,0.15)"/>
  <text x="389" y="59.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#2e5aa8">STORE</text>
  <text x="432" y="74" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">GeoJSON</text>
  <text x="432" y="87" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">organizations.geojson</text>
  <text x="432" y="96" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">20K+ features</text>

  <!-- N4: AI Enrichment — FOCAL -->
  <rect x="342" y="148" width="180" height="52" rx="6"
        fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
  <rect x="346" y="152" width="40" height="10" rx="2" fill="rgba(191,69,32,0.18)"/>
  <text x="366" y="159.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#bf4520">ENRICH</text>
  <text x="432" y="174" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">AI Enrichment</text>
  <text x="432" y="187" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">Brave · crawl · Jev</text>
  <text x="432" y="196" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">website · contacts · classify</text>

  <!-- N5: GitHub Actions — process -->
  <rect x="540" y="48" width="136" height="52" rx="6"
        fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="544" y="52" width="32" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
  <text x="560" y="59.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#4f5d75">CI / CD</text>
  <text x="608" y="74" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">GitHub Actions</text>
  <text x="608" y="87" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">push → deploy-pages</text>
  <text x="608" y="96" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">main / master</text>

  <!-- N6: Browser Map — external/user -->
  <rect x="724" y="48" width="120" height="52" rx="6"
        fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="728" y="52" width="24" height="10" rx="2" fill="rgba(45,49,66,0.08)"/>
  <text x="740" y="59.5" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="5.5" font-weight="700" fill="#4f5d75">MAP</text>
  <text x="784" y="74" text-anchor="middle"
        font-size="9" font-weight="600" fill="#2d3142">Browser Map</text>
  <text x="784" y="87" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#4f5d75">MapLibre · OpenStreetMap</text>
  <text x="784" y="96" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="6.5" fill="#5a6580">GitHub Pages</text>

  <!-- ── LEGEND ── -->
  <text x="16" y="222"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" font-weight="700" fill="#4f5d75" letter-spacing="0.6">NODE TYPE</text>

  <rect x="75" y="215" width="12" height="12" rx="2"
        fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <text x="92" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Input</text>

  <rect x="120" y="215" width="12" height="12" rx="2"
        fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <text x="137" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Process</text>

  <rect x="178" y="215" width="12" height="12" rx="2"
        fill="rgba(46,90,168,0.06)" stroke="rgba(46,90,168,0.35)" stroke-width="1"/>
  <text x="195" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Store</text>

  <rect x="227" y="215" width="12" height="12" rx="2"
        fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
  <text x="244" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Enrich (optional)</text>

  <text x="350" y="222"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" font-weight="700" fill="#4f5d75" letter-spacing="0.6">FLOW</text>

  <line x1="386" y1="221" x2="406" y2="221"
        stroke="#4f5d75" stroke-width="1" marker-end="url(#dflow-arr-muted)"/>
  <text x="412" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Pipeline step</text>

  <line x1="480" y1="221" x2="500" y2="221"
        stroke="#2e5aa8" stroke-width="1" marker-end="url(#dflow-arr-link)"/>
  <text x="506" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Published</text>

  <line x1="558" y1="221" x2="578" y2="221"
        stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"
        marker-end="url(#dflow-arr-muted)"/>
  <text x="584" y="224"
        font-family="'Courier New',Consolas,monospace"
        font-size="6" fill="#5a6580">Optional step</text>

</svg>
